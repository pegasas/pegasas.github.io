# Knowledge tree: section -> group -> subcategory -> item.
# Home page shows sections and group cards; each group has its own page at /notes/<slug>/
# (one stub file per group under notes/_groups is not needed: pages live in notes/<slug>.md).
# Item fields:
#   path: folder or .md file under knowledge/ in pegasas-notes-v2. Links to the site copy
#         (/notes/<path>/) when it has been synced, otherwise to GitHub.
#   url:  direct site link (overrides path).
