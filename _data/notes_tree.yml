          items:
            - {title: "学习基础", path: "ai-models/foundations", desc: "学习目标、优化与泛化"}
            - {title: "LLM", path: "ai-models/llm", desc: "大语言模型的机制与能力"}
            - {title: "工程实践", path: "ai-models/engineering", desc: "训练、调优与上线"}
        - name: 模型架构
