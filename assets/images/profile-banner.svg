<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="John Huang — Notes on systems, data and AI infra">
  <defs>
    <radialGradient id="g1" cx="12%" cy="0%" r="45%"><stop offset="0" stop-color="#7bd43c" stop-opacity=".45"/><stop offset="1" stop-color="#7bd43c" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="90%" cy="20%" r="45%"><stop offset="0" stop-color="#ff7a1f" stop-opacity=".42"/><stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="60%" cy="120%" r="55%"><stop offset="0" stop-color="#3d9bff" stop-opacity=".5"/><stop offset="1" stop-color="#3d9bff" stop-opacity="0"/></radialGradient>
    <linearGradient id="t" x1="0" x2="1"><stop offset="0" stop-color="#7bd43c"/><stop offset=".45" stop-color="#3fe0c5"/><stop offset="1" stop-color="#3d9bff"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#7bd43c" stop-opacity="0"/><stop offset=".3" stop-color="#7bd43c"/><stop offset=".6" stop-color="#3d9bff"/><stop offset=".85" stop-color="#ff7a1f"/><stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".06"/></pattern>
    <radialGradient id="fade" cx="50%" cy="35%" r="65%"><stop offset=".3" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <mask id="m"><rect width="1200" height="300" fill="url(#fade)"/></mask>
    <clipPath id="r"><rect width="1200" height="300" rx="20"/></clipPath>
  </defs>
  <style>
    .f{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif}
    .pulse{animation:p 3.2s ease-in-out infinite}
    @keyframes p{0%,100%{opacity:.55}50%{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="1200" height="300" fill="#07080b"/>
    <rect width="1200" height="300" fill="url(#g1)" class="pulse"/>
    <rect width="1200" height="300" fill="url(#g2)"/>
    <rect width="1200" height="300" fill="url(#g3)"/>
    <rect width="1200" height="300" fill="url(#grid)" mask="url(#m)"/>
    <rect y="298" width="1200" height="2" fill="url(#line)"/>

    <g transform="translate(72 66)">
      <g transform="scale(1.6)">
        <path d="M16 2 L28.1 9 L16 16 L3.9 9 Z" fill="#7bd43c"/>
        <path d="M3.9 9 L16 16 L16 30 L3.9 23 Z" fill="#3d9bff"/>
        <path d="M16 16 L28.1 9 L28.1 23 L16 30 Z" fill="#ff7a1f"/>
        <path d="M16 2 L28.1 9 L28.1 23 L16 30 L3.9 23 L3.9 9 Z M3.9 9 L16 16 L28.1 9 M16 16 V30" fill="none" stroke="#07080b" stroke-width="1.4" stroke-linejoin="round"/>
      </g>
      <text x="66" y="34" class="f" font-size="26" font-weight="800" fill="#fff" letter-spacing=".5">John Huang</text>
    </g>

    <text x="72" y="182" class="f" font-size="52" font-weight="900" fill="#fff" letter-spacing="-1">Notes on <tspan fill="url(#t)">systems, data</tspan> &amp; AI infra.</text>
    <text x="74" y="226" class="f" font-size="19" fill="#98a2b3">LLM · AI Infra · Agentic AI · Physical AI · Distributed Systems · Databases · Cloud Native</text>

    <g transform="translate(940 62)">
      <rect width="190" height="36" rx="18" fill="#7bd43c"/>
      <text x="95" y="24" text-anchor="middle" class="f" font-size="15" font-weight="800" fill="#071006">pegasas.github.io →</text>
    </g>
  </g>
</svg>
